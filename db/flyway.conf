# =====================================================================
# Flyway Configuration File - SGFrotas-Facul (Variáveis via .env / Compose)
# Nunca armazene credenciais reais neste arquivo.
# =====================================================================

flyway.schemas=public
flyway.defaultSchema=public
flyway.table=flyway_schema_history

flyway.locations=filesystem:/flyway/sql,filesystem:db/migrations

# Políticas de Segurança & Continuidade
flyway.baselineOnMigrate=false
flyway.baselineVersion=0
flyway.baselineDescription=SGFrotas Canonical Clean Slate
flyway.validateOnMigrate=true
flyway.cleanDisabled=false
flyway.outOfOrder=false
flyway.mixed=true
