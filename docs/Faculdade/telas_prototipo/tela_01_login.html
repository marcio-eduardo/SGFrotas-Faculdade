<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SGFrotas — 01. Login Corporativo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style> body { font-family: 'Inter', sans-serif; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex items-center justify-center p-4">

  <div class="w-full max-w-md bg-white rounded-3xl border border-slate-200/90 shadow-xl p-8 space-y-6">
    
    <!-- Topo / Identidade -->
    <div class="text-center space-y-2">
      <div class="w-14 h-14 rounded-2xl bg-sky-600 text-white flex items-center justify-center mx-auto shadow-lg shadow-sky-600/25">
        <i data-lucide="shield-check" class="w-8 h-8"></i>
      </div>
      <h1 class="text-2xl font-black text-slate-900 tracking-tight">SGFrotas</h1>
      <p class="text-xs text-slate-500 font-medium">Gestão Integrada de Frotas & Operações de Campo</p>
    </div>

    <!-- Seletor de Perfil de Acesso -->
    <div class="space-y-1.5">
      <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-500">Perfil de Acesso</label>
      <div class="grid grid-cols-2 gap-2 p-1 bg-slate-100 rounded-2xl border border-slate-200 text-xs font-bold">
        <button id="btn-gestor" onclick="selectProfile('gestor')" class="py-2 rounded-xl transition-all bg-white text-sky-700 shadow-sm flex items-center justify-center gap-1.5">
          <i data-lucide="layout-dashboard" class="w-4 h-4 text-sky-600"></i>
          <span>Gestor de Frotas</span>
        </button>
        <button id="btn-tecnico" onclick="selectProfile('tecnico')" class="py-2 rounded-xl transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5">
          <i data-lucide="smartphone" class="w-4 h-4"></i>
          <span>Técnico PWA</span>
        </button>
      </div>
    </div>

    <!-- Formulário de Autenticação -->
    <form class="space-y-4" onsubmit="event.preventDefault();">
      <div class="space-y-1">
        <label id="lbl-identificador" class="block text-xs font-semibold text-slate-700">E-mail Corporativo</label>
        <div class="relative">
          <i data-lucide="mail" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="text" id="input-user" value="gestor.central@veloce.com.br" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all" />
        </div>
      </div>

      <div class="space-y-1">
        <div class="flex items-center justify-between text-xs">
          <label class="font-semibold text-slate-700">Senha de Acesso</label>
          <a href="#" class="text-[11px] text-sky-600 font-semibold hover:underline">Esqueceu?</a>
        </div>
        <div class="relative">
          <i data-lucide="lock" class="w-4 h-4 text-slate-400 absolute left-3.5 top-1/2 -translate-y-1/2"></i>
          <input type="password" value="••••••••••••" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-200 bg-slate-50/50 text-slate-900 text-xs font-medium focus:outline-none focus:ring-2 focus:ring-sky-500 focus:bg-white transition-all font-mono" />
        </div>
      </div>

      <div class="flex items-center justify-between text-xs text-slate-600 pt-1">
        <label class="flex items-center gap-2 cursor-pointer select-none">
          <input type="checkbox" checked class="w-4 h-4 rounded text-sky-600 border-slate-300 focus:ring-sky-500" />
          <span>Lembrar credenciais</span>
        </label>
        <span class="text-[11px] font-semibold text-emerald-600 flex items-center gap-1">
          <i data-lucide="check-circle" class="w-3.5 h-3.5"></i> SSO Conectado
        </span>
      </div>

      <button type="submit" class="w-full py-3 rounded-xl bg-sky-600 hover:bg-sky-500 text-white font-bold text-xs shadow-lg shadow-sky-600/20 transition-all flex items-center justify-center gap-2">
        <span>Acessar Plataforma</span>
        <i data-lucide="arrow-right" class="w-4 h-4"></i>
      </button>
    </form>

    <!-- Rodapé -->
    <div class="text-center pt-2 border-t border-slate-100 text-[11px] text-slate-400 space-y-0.5">
      <p>VeloceTech Serviços Técnicos & Conectividade S.A.</p>
      <p class="font-mono text-[10px] text-slate-400">PostgreSQL Central • 17 Bases Regionais</p>
    </div>

  </div>

  <script>
    lucide.createIcons();

    function selectProfile(profile) {
      const btnGestor = document.getElementById('btn-gestor');
      const btnTecnico = document.getElementById('btn-tecnico');
      const lblId = document.getElementById('lbl-identificador');
      const inputUser = document.getElementById('input-user');

      if (profile === 'gestor') {
        btnGestor.className = "py-2 rounded-xl transition-all bg-white text-sky-700 shadow-sm flex items-center justify-center gap-1.5";
        btnTecnico.className = "py-2 rounded-xl transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5";
        lblId.innerText = "E-mail Corporativo";
        inputUser.value = "gestor.central@veloce.com.br";
      } else {
        btnTecnico.className = "py-2 rounded-xl transition-all bg-white text-sky-700 shadow-sm flex items-center justify-center gap-1.5";
        btnGestor.className = "py-2 rounded-xl transition-all text-slate-500 hover:text-slate-800 flex items-center justify-center gap-1.5";
        lblId.innerText = "Matrícula do Técnico ou CPF";
        inputUser.value = "10482 (Carlos Silva)";
      }
    }
  </script>
</body>
</html>
